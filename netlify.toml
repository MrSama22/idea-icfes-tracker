# Netlify: frontend estático (SPA) + función /api/sync para sincronizar entre dispositivos.
[build]
  command = "bun install && bun run build:web"
  publish = "packages/web/dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.14"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
